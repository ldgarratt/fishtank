<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Enables SharedArrayBuffer on GitHub Pages (for the full Fairy-Stockfish
       engine). Harmless 404 when the file isn't vendored. -->
  <script src="coi-serviceworker.js"></script>
  <title>FishTank — Stockfish variants with mood swings</title>
  <meta name="description" content="Play chess against Stockfish bots whose strength changes mid-game: check PanicFish and it panics, capture against TiltFish and it tilts. Plus dragon-piece chess and three-check." />
  <meta property="og:title" content="FishTank — Stockfish variants with mood swings" />
  <meta property="og:description" content="Play chess against Stockfish bots whose strength changes mid-game." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ldgarratt.github.io/fishtank/" />
  <meta property="og:image" content="https://ldgarratt.github.io/fishtank/img/stockfish.png" />
  <link rel="stylesheet" href="css/style.css?v=17" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🐟</text></svg>" />
</head>
<body>
  <header>
    <a id="home-link" class="header-row" href="#" title="All bots">
      <img class="header-logo" src="img/stockfish.png" alt="" onerror="this.remove()" />
      <div>
        <h1>FishTank</h1>
        <p class="subtitle">Stockfish bots whose strength changes as the game unfolds.</p>
      </div>
    </a>
    <div id="engine-status" class="engine-status">Loading engine…</div>
  </header>

  <!-- Variant picker -->
  <main id="picker">
    <h2>Variant Bots</h2>
    <div id="variant-cards" class="cards"></div>
    <div class="side-row">
      <label for="side-select">Play as:</label>
      <select id="side-select">
        <option value="w" selected>White</option>
        <option value="b">Black</option>
      </select>
    </div>
  </main>

  <!-- Game view -->
  <main id="game" class="hidden">
    <div class="game-layout">
      <div class="bot-panel">
        <div class="bot-card">
          <div class="bot-avatar">
            <img src="img/stockfish.png" alt="" onerror="this.remove()" />
            <span id="mood" class="mood">🤖</span>
          </div>
          <div class="bot-info">
            <div id="opp-name" class="opp-name"></div>
            <div id="opp-desc" class="opp-desc"></div>
          </div>
        </div>
        <div class="elo-wrap">
          <div class="elo-track"><div id="elo-bar" class="elo-bar"></div></div>
        </div>
      </div>
      <div class="board-col">
        <div class="board-wrap">
          <div id="board" class="board"></div>
          <div id="promo" class="promo hidden"></div>
        </div>
        <div id="status" class="status"></div>
        <div class="controls">
          <button id="btn-rematch" class="primary hidden">⚔️ Rematch</button>
          <button id="btn-undo">↩️ Undo</button>
          <button id="btn-resign">🏳️ Resign</button>
          <button id="btn-new">🔄 New game</button>
          <button id="btn-analyse" class="hidden">🔍 Analyse game</button>
          <button id="btn-pgn">📋 Copy PGN</button>
          <button id="btn-switch">🐟 Switch fish</button>
          <button id="btn-sound">🔊 Sound</button>
        </div>
      </div>
      <div class="log-col">
        <div id="analysis" class="analysis hidden"></div>
        <h2>Feed</h2>
        <div id="log" class="log"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>
      Powered by real <a href="https://stockfishchess.org/" target="_blank" rel="noopener">Stockfish</a> (GPLv3).
      Chess rules by <a href="https://github.com/jhlywa/chess.js" target="_blank" rel="noopener">chess.js</a>.
      Stockfish icon by Klein Maetschke.
      Chess pieces by Colin M.L. Burnett (CC BY-SA 3.0).
      Sounds from <a href="https://github.com/lichess-org/lila" target="_blank" rel="noopener">lichess</a>.
    </p>
  </footer>

  <script>
    // Sequential script loader with local-first, CDN-fallback for chess.js.
    (function () {
      function load(srcs, then) {
        if (!srcs.length) { console.error('All sources failed'); return; }
        var s = document.createElement('script');
        s.src = srcs[0];
        s.onload = then;
        s.onerror = function () { load(srcs.slice(1), then); };
        document.body.appendChild(s);
      }
      function chain(groups) {
        if (!groups.length) return;
        load(groups[0], function () { chain(groups.slice(1)); });
      }
      chain([
        ['vendor/chess.js',
         'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js',
         'https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js'],
        ['js/variants.js?v=17'],
        ['js/engine.js?v=17'],
        ['js/sound.js?v=17'],
        ['js/analysis.js?v=17'],
        ['js/fairy-engine.js?v=17'],
        ['js/dragon.js?v=17'],
        ['js/app.js?v=17'],
      ]);
    })();
  </script>
</body>
</html>
