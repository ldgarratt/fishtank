name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Vendor Stockfish + chess.js into the deployed site so it is fully
      # self-contained (no CDN needed at runtime).
      - name: Download engine and libraries
        run: |
          bash engine/get-engine.sh
          mkdir -p vendor
          curl -fsSL -o vendor/chess.js \
            https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
